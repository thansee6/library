services:
  # --- Backend API ---
  - type: web
    name: library-api
    plan: free
    runtime: node
    region: oregon
    rootDir: backend
    buildCommand: npm ci
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false

  # --- Static Frontend ---
  - type: static
    name: library-frontend
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm run build
    publishDir: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: library-api
          property: host
